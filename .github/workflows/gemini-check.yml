# Checks that the repository secret GEMINI_API_KEY works, with one tiny
# request per Gemini model the project uses. Prints only "works" or Google's
# error message; the key itself is never printed (GitHub also masks it).
# Runs by itself on every push to the branch gemini-key-check, or by hand
# (Actions tab -> "Check Gemini key" -> Run workflow) once it is on main.
name: Check Gemini key

on:
  workflow_dispatch:
  push:
    branches: [gemini-key-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: One request per model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "The secret GEMINI_API_KEY is empty or missing."; exit 1; fi
          fail=0
          for model in gemini-3.5-flash-lite gemini-3.1-flash-lite; do
            code=$(curl -s -o out.json -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply with the word ok."}]}],"generationConfig":{"temperature":0}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
            if [ "$code" = 200 ]; then echo "$model: works"; else echo "$model: HTTP $code $(head -c 300 out.json)"; fail=1; fi
            echo "$model: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          done
          for model in gemini-embedding-001; do
            code=$(curl -s -o out.json -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"content":{"parts":[{"text":"a fresh white wine"}]},"outputDimensionality":768}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:embedContent")
            if [ "$code" = 200 ]; then echo "$model: works"; else echo "$model: HTTP $code $(head -c 300 out.json)"; fail=1; fi
            echo "$model: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -f out.json
          exit $fail
