seed: 42

paths:
  raw_csv: data/raw/winemag-data-130k-v2.csv
  processed_dir: data/processed
  eda_dir: results/eda

split:
  test_size: 200
  dev_size: 100
  # Only notes with at least this many words can be picked for test/dev
  # (they stay in the catalogue either way).
  min_words: 20
  # Variety frequency bands, by number of reviews of the wine's variety:
  # 1-10, 11-100, 101-1000, >1000
  band_edges: [10, 100, 1000]
  test_min_per_band: 30
  dev_min_per_band: 15

tail:
  # A wine is in the long tail if its winery has at most this many
  # reviews (see DECISIONS.md, 2026-10-21).
  unit: winery
  max_reviews: 10

# Number of recommendations per query
k: 5

semantic:
  model: sentence-transformers/all-MiniLM-L6-v2
  # Pin the exact model version after the first download: copy the commit
  # hash from ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2/refs/main
  revision: null
  batch_size: 64
  cache_dir: data/processed/embeddings

demo:
  queries: data/demo_queries.txt
  out_dir: results/demo

tfidf:
  # Standard settings, not tuned (Semantic is not tuned either), DECISIONS.md
  min_df: 2
  stop_words: english
  # ...minus these words, which carry meaning in notes and queries (DECISIONS.md)
  keep_words: [not, "no", too, very, less, more, without, full]
  sublinear_tf: true
  ngram_range: [1, 1]

attribute:
  # Hand-made variety -> colour table (to be checked by the student)
  colour_table: data/variety_colour.csv

eval:
  queries_dir: data/queries
  out_dir: results
  # Tail share is also reported at these thresholds (robustness check)
  robustness_tail: [5, 20]

llm:
  # Local model via Ollama (DECISIONS.md D2). Before `make queries`:
  #   ollama pull llama3.2:3b-instruct-q4_K_M
  # then pin `digest` (ID column of `ollama list`) and `ollama_version`
  # (`ollama --version`). Check the tag on the Ollama library page.
  model: llama3.2:3b-instruct-q4_K_M
  digest: null
  ollama_version: null
  url: http://localhost:11434/api/generate
  temperature: 0
  seed: 42
  cache_dir: data/llm_cache

queries:
  vocab: data/wine_vocab.txt
  out_dir: data/queries
  quality: results/queries_quality.csv
  max_retries: 3
  # {note} = the tasting note, {banned} = the expert terms of the vocabulary
  prompt: |
    Here is a professional wine tasting note:

    "{note}"

    Imagine a person who knows nothing about wine has just tasted this wine.
    Write what they would say to a friend about how it tastes, in one or two
    short sentences, using plain everyday words.

    Rules:
    - Describe only the taste and how it feels in the mouth. You may say
      whether it is red, white, rosé or sparkling.
    - Do not mention food, occasions, prices or numbers.
    - Do not name the grape, the winery, the region or the country.
    - Do not use these wine-expert words: {banned}.
    - Reply with the description only, without quotation marks or any introduction.
  # Added after the prompt when the answer broke a rule (DECISIONS.md)
  retry_prompt: |

    Your previous answer was: "{previous}"
    It used words that are not allowed: {problems}.
    Rewrite it without those words, following the same rules.
    Reply with the description only.

human:
  # Hand-written queries from novices on 30 test wines (D1, D6)
  n_wines: 30
  min_per_band: 5
  cards: data/human_cards.csv
  template: data/human_queries_template.csv
  # the filled-in copy of the template
  queries: data/human_queries.csv

refinement:
  # Build / measure word lists per trait (D5)
  lexicons: data/refinement_lexicons.yaml
  # alpha: chosen on dev = smallest value within tolerance_pp of the best
  alphas: [0.05, 0.1, 0.2, 0.3, 0.5]
  tolerance_pp: 2
  # control (a): random directions with the same alpha
  n_random: 10
  sommelier_cases: 10
  out_dir: results
