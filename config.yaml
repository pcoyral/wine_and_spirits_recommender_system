seed: 42

paths:
  raw_csv: data/raw/winemag-data-130k-v2.csv
  processed_dir: data/processed
  eda_dir: results/eda

split:
  test_size: 200
  dev_size: 100
  # Only notes with at least this many words can be picked for test/dev
  # (they stay in the catalogue either way).
  min_words: 20
  # Variety frequency bands, by number of reviews of the wine's variety:
  # 1-10, 11-100, 101-1000, >1000
  band_edges: [10, 100, 1000]
  test_min_per_band: 30
  dev_min_per_band: 15

tail:
  # A wine is in the long tail if its winery has at most this many
  # reviews (see DECISIONS.md, 2026-10-21).
  unit: winery
  max_reviews: 10

# Number of recommendations per query
k: 5

semantic:
  model: sentence-transformers/all-MiniLM-L6-v2
  # Pin the exact model version after the first download: copy the commit
  # hash from ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2/refs/main
  revision: null
  batch_size: 64
  cache_dir: data/processed/embeddings

demo:
  queries: data/demo_queries.txt
  out_dir: results/demo
