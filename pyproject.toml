[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoryrec"
version = "0.2.0"
description = "Content-based wine recommender for novices, delivered through a RAG chatbot"
requires-python = ">=3.11"

# Runtime dependencies are pinned in requirements.txt rather than here.
# This file exists to make `sensoryrec` importable (`pip install -e .`).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
