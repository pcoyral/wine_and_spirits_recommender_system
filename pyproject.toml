[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoryrec"
version = "0.1.0"
description = "A natural language-driven hybrid recommender system for wine and spirits discovery"
requires-python = ">=3.11"

# Runtime dependencies are pinned in requirements.txt / requirements.lock.txt
# rather than here, so the venv stays the single source of truth during the
# capstone. This file exists to make `src` importable as a package.

[tool.setuptools]
packages = ["src", "src.models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
